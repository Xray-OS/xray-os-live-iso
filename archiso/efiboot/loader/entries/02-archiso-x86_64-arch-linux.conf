title   Xray_OS x86_64 UEFI (Kernel Linux Arch)
sort-key B
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=n module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes psi=1 quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
