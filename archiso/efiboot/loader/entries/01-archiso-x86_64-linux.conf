title   Xray_OS x86_64 UEFI Default
sort-key A
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-vita
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-vita.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=n module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes psi=1
